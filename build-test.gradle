// 独立测试构建脚本 - 不依赖 ForgeGradle/Minecraft
// 用法: Gradle 8.9 --no-build-cache -b build-test.gradle test

plugins {
    id 'org.jetbrains.kotlin.jvm' version '1.9.0'
}

group = 'io.github.orryxmod'
version = '1.4.4'

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

sourceSets {
    main {
        kotlin.srcDirs = ['src/main/kotlin', 'src/test-stubs/kotlin']
        java.srcDirs = [] // 排除所有 Java 源文件（mixin 等）
        kotlin {
            include 'io/github/orryxmod/core/event/**'
            include 'io/github/orryxmod/core/api/**'
            include 'io/github/orryxmod/core/registry/ServiceLocator.kt'
            include 'io/github/orryxmod/core/registry/FeatureRegistry.kt'
            include 'io/github/orryxmod/core/render/EffectManager.kt'
            include 'io/github/orryxmod/core/render/RenderContext.kt'
            include 'io/github/orryxmod/core/network/OrryxPacket.kt'
            include 'io/github/orryxmod/core/network/PacketCodec.kt'
            include 'io/github/orryxmod/core/network/PacketDispatcher.kt'
            include 'io/github/orryxmod/feature/shockwave/Shape.kt'
            include 'io/github/orryxmod/feature/shockwave/ShockwaveConfig.kt'
            include 'io/github/orryxmod/feature/shockwave/ShockwaveDsl.kt'
            include 'io/github/orryxmod/feature/bloom/BloomConfig.kt'
            include 'io/github/orryxmod/feature/bloom/BloomConfigManager.kt'
            include 'io/github/orryxmod/feature/collider/ColliderType.kt'
            // Stubs - 使用 _stub 后缀避免与主代码冲突
            include 'stubs/**'
        }
    }
    test {
        kotlin.srcDirs = ['src/test/kotlin']
    }
}

dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.0'
    implementation 'org.jetbrains.kotlin:kotlin-reflect:1.9.0'
    implementation 'org.joml:joml:1.10.7'
    implementation 'com.google.guava:guava:31.1-jre'
    implementation 'org.apache.logging.log4j:log4j-api:2.17.2'
    implementation 'org.apache.logging.log4j:log4j-core:2.17.2'
    implementation 'io.netty:netty-all:4.1.9.Final'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'io.mockk:mockk:1.13.10'
    testImplementation 'org.jetbrains.kotlin:kotlin-test-junit5:1.9.0'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = true
        exceptionFormat = 'full'
    }
}
