name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Install Java 8 toolchain
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "8"

      - name: Use JDK 17 for Gradle
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Run tests and verify release candidate
        run: ./gradlew --no-daemon --stacktrace clean unitTest verifyReleaseJar

      - name: Validate Java 8 bytecode and release candidate
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t jars < <(printf '%s\n' builds/orryxmod-*.jar | grep -Ev -- '-(plain|api|api-source|sources|javadoc)\.jar$')
          if [[ ${#jars[@]} -ne 1 || ! -f "${jars[0]}" ]]; then
            printf 'Expected one release JAR, found %s:\n' "${#jars[@]}" >&2
            printf '  %s\n' "${jars[@]:-<none>}" >&2
            exit 1
          fi
          jar tf "${jars[0]}" > jar-contents.txt
          grep -q '^mcmod.info$' jar-contents.txt
          class_file=$(grep '\.class$' jar-contents.txt | sed -n '1p')
          [[ -n "$class_file" ]] || { echo 'Release JAR contains no class files' >&2; exit 1; }
          unzip -p "${jars[0]}" "$class_file" > first-class.bin
          od -An -t u1 -N 8 first-class.bin | grep -Eq '202[[:space:]]+254[[:space:]]+186[[:space:]]+190[[:space:]]+0[[:space:]]+0[[:space:]]+0[[:space:]]+52'

      - name: Upload diagnostic reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-diagnostics-${{ github.run_id }}
          path: |
            builds/reports/
            build/reports/
          if-no-files-found: ignore
          retention-days: 7
