name: 功能建议
description: 提议兼容 OrryxMod 定位的新功能或改进
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索现有 Issue 和 Pull Request。
          required: true
        - label: 该建议适用于 Minecraft 1.12.2 Forge 客户端模组。
          required: true
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述当前限制和实际使用场景，而不只是期望的实现。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明客户端行为、服务端协议/API、兼容性和配置变化。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 说明尝试过或考虑过的其他方案。
  - type: dropdown
    id: breaking
    attributes:
      label: 是否涉及不兼容变更
      options:
        - 否
        - 可能，需要维护者评估
        - 是，已说明迁移方案
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 可附示意图、伪代码、协议草案或相关链接。请勿上传无再分发许可的素材。
