buildscript {
    repositories {
        mavenCentral()
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://repo.spongepowered.org/maven/' }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:5.+'
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
        classpath 'com.github.jengelman.gradle.plugins:shadow:6.1.0'
    }
}

plugins {
    id 'org.jetbrains.kotlin.jvm' version "$kotlinVersion"
    id 'maven-publish'
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.spongepowered.mixin'
apply plugin: 'com.github.johnrengelman.shadow'

// 项目信息
version = project.modVersion
group = project.modGroup // 参考Maven命名规范: http://maven.apache.org/guides/mini/guide-naming-conventions.html
archivesBaseName = 'orryxmod'
buildDir project.build

// 仓库
repositories {
    mavenCentral()
    maven { url = 'https://repo.spongepowered.org/maven/' }
    maven { url = 'https://impactdevelopment.github.io/maven/' }
    maven { url = 'https://jitpack.io' }
}

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'

def java8Launcher = project.extensions
    .getByType(org.gradle.jvm.toolchain.JavaToolchainService)
    .launcherFor {
        languageVersion = org.gradle.jvm.toolchain.JavaLanguageVersion.of(8)
    }

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions.jvmTarget = '1.8'
    kotlinJavaToolchain.toolchain.use(java8Launcher)
}

// Minecraft 配置
minecraft {
    // 映射可以随时更改，必须采用以下格式：
    // snapshot_YYYYMMDD   快照版本每晚构建
    // stable_#            稳定版本由MCP团队决定发布
    // 使用非默认映射需自行承担风险，它们可能并不总是有效。
    // 更改映射后只需重新运行setup任务即可更新工作区。
    //mappings channel: 'snapshot', version: '20171003-1.12'
    mappings channel: "$mappingsChannel", version: "$mappingsVersion"
    // makeObfSourceJar = false // 默认会生成Srg命名的源码jar。取消注释此行可禁用。


    // accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    // 默认运行配置。
    // 可以根据需要调整、删除或复制这些配置。
    runs {
        client {
            workingDirectory file('run')

            property 'fml.coreMods.load', 'io.github.orryxmod.OrryxCoreMod'

            property 'mixin.env.disableRefMap', 'true'
            // 推荐的用户开发环境日志数据
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'

            // 推荐的控制台日志级别
            property 'forge.logging.console.level', 'debug'
        }
    }
}

// 依赖配置
configurations {
    jarLibs
    onlyJarLibs
    configureEach {
        resolutionStrategy {
            force 'org.lwjgl.lwjgl:lwjgl-platform:2.9.4-nightly-20150209'
        }
    }
}

// 依赖
dependencies {
    // 测试
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation "io.mockk:mockk:1.13.10"
    testImplementation "org.jetbrains.kotlin:kotlin-test-junit5:$kotlinVersion"
    testImplementation 'com.google.guava:guava:31.1-jre'
    testImplementation 'org.joml:joml:1.10.7'
    testImplementation "org.jetbrains.kotlin:kotlin-reflect:$kotlinVersion"

    // Forge
    minecraft "net.minecraftforge:forge:$minecraftVersion-$forgeVersion"

    // Mixin - 使用 compileOnly 避免被 Forge 扫描，运行时由 TweakClass 加载
    compileOnly('org.spongepowered:mixin:0.8.5') {
        exclude module: 'commons-io'
        exclude module: 'gson'
        exclude module: 'guava'
    }
    annotationProcessor('org.spongepowered:mixin:0.8.5:processor') {
        exclude module: 'gson'
    }
    // Mixin 运行时依赖（仅用于开发环境）
    runtimeOnly('org.spongepowered:mixin:0.8.5') {
        exclude module: 'commons-io'
        exclude module: 'gson'
        exclude module: 'guava'
    }

    // Kotlin
    jarLibs("org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlinVersion") {
        exclude module: 'kotlin-stdlib-common'
        exclude module: 'annotations'
    }
    jarLibs("org.jetbrains.kotlin:kotlin-reflect:$kotlinVersion") {
        exclude module: 'kotlin-stdlib'
    }
    // 工具库
    jarLibs 'org.joml:joml:1.10.7'

    // 编译时依赖
    compileOnly "org.jetbrains.kotlin:kotlin-stdlib-common:$kotlinVersion"
    compileOnly 'org.jetbrains:annotations:23.0.0'

    // Baritone
    implementation('cabaletta:baritone-deobf-unoptimized-mcp-dev:1.2').setChanging(true)
    onlyJarLibs('cabaletta:baritone-api:1.2').setChanging(true)

    implementation configurations.jarLibs
}

// Mixin 配置
mixin {
    defaultObfuscationEnv 'searge'
    add sourceSets.main, 'mixins.orryxmod.refmap.json'
    config 'mixins.orryxmod.json'
}

// 资源处理
processResources {
    exclude '**/rawimagefiles'
    from(sourceSets.main.resources.srcDirs) {
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
        include 'mcmod.info'
        expand version: version, 'mcversion': minecraftVersion
    }
}

// 普通 JAR 仅用于开发检查，避免与可发布 Shadow JAR 同名。
jar {
    archiveClassifier.set 'plain'
}

// Shadow JAR
shadowJar {
    manifest.attributes(
        'Manifest-Version': 1.0,
        'MixinConfigs': 'mixins.orryxmod.json',
        'TweakClass': 'org.spongepowered.asm.launch.MixinTweaker',
        'FMLCorePluginContainsFMLMod': 'true',
        'FMLCorePlugin': 'io.github.orryxmod.OrryxCoreMod',
        'ForceLoadAsMod': 'true'
    )

    archiveClassifier.set ''

    exclude '**/module-info.class',
            'DebugProbesKt.bin',
            'META-INF/proguard/**',
            'META-INF/versions/**',
            'META-INF/**.RSA',
            'META-INF/com.android.tools/**',
            'META-INF/*.version'

    // 排除 Mixin JAR 文件，避免 Forge 将其作为模组解析
    dependencies {
        exclude(dependency('org.spongepowered:mixin:.*'))
    }

    minimize {
        exclude dependency('cabaletta:baritone-api:.*')
        exclude dependency('org.spongepowered:mixin:.*')
        exclude dependency('org.jetbrains.kotlin:.*')
    }

    configurations = [project.configurations.jarLibs, project.configurations.onlyJarLibs]

    // 不 relocate kotlin，否则 kotlin-reflect 无法工作
    // relocate 'kotlin', 'io.github.orryxmod.shadow.kotlin'
    // relocate 'kotlinx', 'io.github.orryxmod.shadow.kotlinx'

    finalizedBy 'configureReobfTaskForReobfShadowJar', 'reobfShadowJar'
    mustRunAfter 'jar'
}

// 混淆
reobf {
    shadowJar {}
    jar { setEnabled false }
}

// 自定义任务
tasks.register('buildApiSource', Jar) {
    group 'build'
    description '打包 API 源码'
    archiveClassifier.set 'api-source'
    from sourceSets.main.allSource
}

tasks.register('buildApi', Jar) {
    group 'build'
    description '打包 API 库'
    archiveClassifier.set 'api'
    from sourceSets.main.output
}

tasks.register('buildAll') {
    group 'build'
    description '构建所有产物'
    dependsOn 'buildApi', 'buildApiSource', 'build'
}

tasks.withType(Jar).configureEach {
    destinationDirectory.set buildDir
}

sourceSets.each {
    def dir = layout.buildDirectory.file("sourcesSets/$it.name").get().asFile
    it.output.resourcesDir = dir
    it.java.outputDir = dir
}

// 测试配置
tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

sourceSets {
    test {
        kotlin.srcDirs = ['src/test/kotlin']
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

tasks.register('unitTest', Test) {
    group 'verification'
    description '运行单元测试'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = true
    }
}